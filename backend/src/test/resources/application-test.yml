# Test profile: isolated H2 in-memory DB (PostgreSQL mode). No Docker required.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agentic_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate

app:
  admin:
    username: admin
    password: admin-test-secret
  analytics:
    hash-salt: test-salt
  rate-limit:
    enabled: false
