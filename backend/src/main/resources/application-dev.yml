# Dev profile: H2 in-memory, PostgreSQL compatibility mode. No Docker required.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:agentic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
